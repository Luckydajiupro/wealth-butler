            if (text.includes('MANUAL_REVIEW_REQUIRED') || text.includes('需要人工审核')) {
                return '当前申购需要人工适当性复核，尚未执行交易。请先完成复核并补齐合规记录，再继续办理。';
            }
            return text;
        }

        function appendSimulatedDoubleRecordAction() {
            const messages = document.getElementById('aiMessages');
            if (!messages || document.getElementById('simulatedDoubleRecordCard')) return;
            const card = document.createElement('div');
            card.className = 'ai-confirmation';
            card.id = 'simulatedDoubleRecordCard';
            card.innerHTML = '<strong>测试双录流程</strong><br>仅用于本地联调：生成带客户、产品、经办人和时间审计信息的模拟证据，并写入 MinIO 与合规证据表。<div class="ai-confirmation-actions"><button class="ai-confirmation-cancel" onclick="document.getElementById(\'simulatedDoubleRecordCard\')?.remove()">暂不发起</button><button class="ai-confirmation-confirm" onclick="startSimulatedDoubleRecord()">发起测试双录</button></div>';
            messages.appendChild(card);
            messages.scrollTop = messages.scrollHeight;
            startConfirmationStatusPolling(pendingConfirmToken);
        }

        function stopConfirmationStatusPolling() {
            if (confirmationStatusPollTimer) window.clearInterval(confirmationStatusPollTimer);
            confirmationStatusPollTimer = null;
        }

        function startConfirmationStatusPolling(confirmToken) {
            stopConfirmationStatusPolling();
            if (!confirmToken) return;
            const check = async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/chat/operator/confirmations/${encodeURIComponent(confirmToken)}`, {
                        headers: {'Authorization': `Bearer ${localStorage.getItem('access_token')}`}
                    });
                    if (!response.ok) return;
                    const payload = await response.json();
                    const confirmation = payload.data || {};
                    if (['待确认', '已确认'].includes(confirmation.status)) return;
                    stopConfirmationStatusPolling();
                    pendingConfirmToken = null;
                    document.getElementById('aiConfirmationCard')?.remove();
                    if (confirmation.status === '已取消') {
                        appendAIMessage('assistant', '客户已取消本次业务申请，未执行交易。');
                        return;
                    }
                    const operationResult = confirmation.result || {};
                    appendAIMessage('assistant', `客户已完成二次确认：${operationResult.message || '操作已处理'}`);
                    const transactionId = Number(operationResult.data?.transaction_id) || 0;
                    if (operationResult.success && transactionId && activeWorkorderId) {
                        await completeActiveWorkorder(transactionId, operationResult.data?.transaction_type || '交易');
                    }
                    await Promise.all([loadWorkorders(), loadStatistics()]);
                } catch (error) {
                    console.debug('客户确认状态暂时不可用:', error);
                }
            };
            check();
            confirmationStatusPollTimer = window.setInterval(check, 3000);
        }

        function operatorNotificationSeenKey() {
            return `operator_seen_confirmation_notifications_${currentOperatorId()}`;
        }

        function readSeenOperatorNotifications() {
            try {
                return new Set(JSON.parse(sessionStorage.getItem(operatorNotificationSeenKey()) || '[]'));
            } catch (error) {
                return new Set();
            }
        }

        function saveSeenOperatorNotifications(seen) {
            sessionStorage.setItem(operatorNotificationSeenKey(), JSON.stringify(Array.from(seen).slice(-200)));
        }

        async function pollOperatorNotifications() {
            const token = localStorage.getItem('access_token');
            if (!token || !currentOperatorId()) return;
            try {
                const response = await fetch(`${API_BASE}/api/chat/operator/notifications?limit=50`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                if (!response.ok) return;
                const payload = await response.json();
                const notifications = payload.data?.items || [];
                const seen = readSeenOperatorNotifications();
                if (!operatorNotificationBaselineReady) {
                    notifications.forEach(item => item.id && seen.add(item.id));
                    saveSeenOperatorNotifications(seen);
                    operatorNotificationBaselineReady = true;
                    return;
                }
                const fresh = notifications.filter(item => item.id && !seen.has(item.id)).reverse();
                for (const notification of fresh) {
                    seen.add(notification.id);
                    stopConfirmationStatusPolling();
                    pendingConfirmToken = null;
                    document.getElementById('aiConfirmationCard')?.remove();
                    const assistant = document.getElementById('aiAssistant');
                    if (assistant?.classList.contains('minimized')) toggleAI();
                    const customerLabel = notification.customer_name || `客户 ${notification.customer_id}`;
                    const operationResult = notification.result || {};
                    if (notification.action === 'cancel') {
                        appendAIMessage('assistant', `${customerLabel} 已取消本次交易，交易未执行。`);
                    } else {
                        appendAIMessage('assistant', `${customerLabel} 已确认本次交易：${operationResult.message || '操作已处理'}`);
                        const transactionId = Number(operationResult.data?.transaction_id) || 0;
                        if (operationResult.success && transactionId && activeWorkorderId) {
                            await completeActiveWorkorder(transactionId, operationResult.data?.transaction_type || '交易');
                        }
                    }
                    if (String(selectedCustomerId || '') === String(notification.customer_id || '')) {
                        await loadCustomerOverview(notification.customer_id);
                    }
                }
                if (fresh.length) {
                    saveSeenOperatorNotifications(seen);
                    await Promise.all([loadWorkorders(), loadStatistics(), loadRecentCustomers()]);
                }
            } catch (error) {
                console.debug('客户确认结果通知暂时不可用:', error);
            }
        }

        function stopOperatorNotificationPolling() {
            if (operatorNotificationPollTimer) window.clearInterval(operatorNotificationPollTimer);
            operatorNotificationPollTimer = null;
        }

        function startOperatorNotificationPolling() {
            stopOperatorNotificationPolling();
            operatorNotificationBaselineReady = false;
            pollOperatorNotifications();
            operatorNotificationPollTimer = window.setInterval(pollOperatorNotifications, 3000);
        }

        async function startSimulatedDoubleRecord() {
            const customerId = parseInt(localStorage.getItem('customer_id')) || 0;
            const token = localStorage.getItem('access_token');
            const workorder = allWorkorders.find(item => String(item.id) === String(activeWorkorderId));
            if (!customerId || !token) return appendAIMessage('assistant', '请先选择客户并保持登录状态。');
            const card = document.getElementById('simulatedDoubleRecordCard');
            try {
                const response = await fetch(`${API_BASE}/api/compliance/test/double-record`, {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify({customer_id: customerId, product_id: 3, workorder_id: workorder?.id || null})
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.detail || '测试双录发起失败');
                card?.remove();
                appendAIMessage('assistant', '测试双录已完成并归档，正式合规 Loader 已可读取。请重新发起申购，系统仍会要求客户页二次确认。');
            } catch (error) {
                appendAIMessage('assistant', `测试双录未完成：${error.message}`);
            }
        }

        function showAIConfirmation() {
            const messages = document.getElementById('aiMessages');
            const card = document.createElement('div');
            card.className = 'ai-confirmation';
            card.id = 'aiConfirmationCard';
            card.innerHTML = `<strong>等待客户二次确认</strong><br>业务草稿已发送到客户页面。客户确认前不会执行交易，也不会改变账户、持仓或交易记录。
                <div class="ai-confirmation-actions">
                    <button class="ai-confirmation-cancel" onclick="resolvePendingOperatorAction('cancel')">撤回申请</button>
                </div>`;
            messages.appendChild(card);
            messages.scrollTop = messages.scrollHeight;
        }

        async function resolvePendingOperatorAction(action) {
            if (!pendingConfirmToken) return;
            const token = pendingConfirmToken;
            pendingConfirmToken = null;
            const card = document.getElementById('aiConfirmationCard');
            if (card) card.remove();
            stopConfirmationStatusPolling();
            await confirmOperatorAction(token, action);
        }

        // 用户下拉菜单
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }

        function viewProfile() {
            showOperatorModal('个人信息', `<dl><dt>登录账号</dt><dd>${escapeHtml(localStorage.getItem('username') || '当前账号')}</dd><dt>业务角色</dt><dd>客户经理 / 运营</dd></dl>`, '<button class="operator-modal-primary" onclick="closeOperatorModal()">关闭</button>');
        }

        function viewSettings() {
            showOperatorModal('系统设置', '当前工作台使用数据库实时工单、客户范围授权和模拟交易账户。系统设置由业务管理员统一维护。', '<button class="operator-modal-primary" onclick="closeOperatorModal()">关闭</button>');
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.clear();
                window.location.href = '/login.html';
            }
        }

        // AI助手功能
        function toggleAI() {
            const assistant = document.getElementById('aiAssistant');
            assistant.classList.toggle('minimized');

            const toggle = document.getElementById('aiToggle');
            toggle.textContent = assistant.classList.contains('minimized') ? '+' : '−';
        }

        // HTML转义函数（防XSS攻击）
        function escapeHtml(text) {
            if (!text) return '';
            const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function handleAIKeyPress(event) {
            if (event.key === 'Enter') {
                sendAIMessage();
            }
        }

        async function consumeSse(response, onContent) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            function consumeEvent(rawEvent) {
                const payloadLines = [];
                let dataStarted = false;
                rawEvent.replace(/\r/g, '').split('\n').forEach(line => {
                    if (line.startsWith('data:')) {
                        dataStarted = true;
                        payloadLines.push(line.slice(5).replace(/^ /, ''));
                    } else if (dataStarted && line && !line.startsWith(':')) {
                        // 兼容服务端历史帧中未逐行添加 data: 前缀的多行内容。
                        payloadLines.push(line);
                    }
                });
                if (!dataStarted && rawEvent.trim() && !rawEvent.trim().startsWith(':')) {
                    // 兼容旧服务端把正文空行误当成 SSE 事件分隔符的情况。
                    payloadLines.push(rawEvent.replace(/\r/g, ''));
                }

                const payload = payloadLines.join('\n');
                if (!payload || payload.trim() === '[EOF]') return;

                try {
                    const structured = JSON.parse(payload);
                    if (structured.type === 'error' || (structured.code != null && structured.code !== 0)) {
                        throw new Error(structured.content || structured.message || '服务处理失败');
                    }
                    onContent(structured.content || payload);
                } catch (error) {
                    if (error instanceof SyntaxError) {
                        onContent(payload);
                        return;
                    }
                    throw error;
                }
            }

            while (true) {
                const {done, value} = await reader.read();
                buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
                const events = buffer.split(/\r?\n\r?\n/);
                buffer = events.pop() || '';
                events.forEach(consumeEvent);
                if (done) break;
            }
            if (buffer.trim()) consumeEvent(buffer);
        }

        async function sendAIMessage(message) {
            const input = document.getElementById('aiInput');
            const query = message || input.value.trim();

            if (!query) return;

            // 将当前已领取工单的原始事项交给 NL2API，帮助模型识别工单中的产品名、金额和份额。
            // 产品 ID 仍由服务端产品库解析，前端不直接提交或生成交易参数。
            const activeOrder = allWorkorders.find(item => String(item.id) === String(activeWorkorderId));
            const operationQuery = activeOrder && /申购|赎回|转账|资料变更/.test(query)
                ? `${query}\n当前已领取工单事项：${activeOrder.intent_summary || activeOrder.title || ''}`
                : query;

            input.value = '';
            appendAIMessage('user', query);
            const token = localStorage.getItem('access_token');
            const userId = parseInt(localStorage.getItem('user_id')) || 1;
            const storedCustomerId = parseInt(localStorage.getItem('customer_id')) || 0;
            const customerId = Number(selectedCustomerId) || storedCustomerId || null;

            const isProductQuery = /查询.*(产品|理财|基金)|在售.*(产品|理财|基金)|(产品|理财|基金).*查询/.test(query);
            if (!customerId && !isProductQuery) {
                appendAIMessage('assistant', '请先选择客户，再进行查询或业务办理。');
                openCustomerPicker('选择客户', 'selectAssistantCustomer');
                return;
            }

            const sendButton = document.getElementById('aiSendBtn');
            input.disabled = true;
            sendButton.disabled = true;
            const loading = appendAIMessage('status', '业务助手正在处理...', 'aiLoadingMessage');
            try {
                const response = await fetch(`${API_BASE}/api/chat/operator`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: operationQuery,
                        session_id: customerId ? getOperatorSessionId(customerId) : `operator_product_query_${userId}`,
                        user_id: userId,
                        customer_id: customerId || null,
                        is_stream: true
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('业务助手请求失败:', response.status, errorText);
                    appendAIMessage('assistant', '业务助手暂时不可用，请稍后重试。');
                    return;
                }

                let fullResponse = '';
                await consumeSse(response, content => {
                    fullResponse += content;
                });

                if (fullResponse) {
                    const tokenMatch = fullResponse.match(/确认令牌:\s*([^\s]+)/);
                    const displayResponse = explainOperatorMessage(fullResponse.replace(/\n?确认令牌:\s*[^\s]+/g, '').trim());
                    appendAIMessage('assistant', displayResponse || '业务要素已核对，请进行二次确认。');
                    if (fullResponse.includes('double_record_completed')) appendSimulatedDoubleRecordAction();
                    if (tokenMatch) {
                        pendingConfirmToken = tokenMatch[1];
                        document.getElementById('aiConfirmationCard')?.remove();
                        showAIConfirmation();
                    }
                } else {
                    appendAIMessage('assistant', '业务助手未返回内容，请稍后重试。');
                }

            } catch (error) {
                console.error('AI助手错误:', error);
                appendAIMessage('assistant', `业务助手失败：${error.message || '请稍后重试'}`);
            } finally {
                loading?.remove();
                input.disabled = false;
                sendButton.disabled = false;
                input.focus();
            }
        }

        async function confirmOperatorAction(confirmToken, action) {
            try {
                const response = await fetch(`${API_BASE}/api/chat/operator/confirm`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('access_token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({confirm_token: confirmToken, action: action})
                });
                const result = await response.json();
                if (!response.ok || result.status_code !== 200) {
                    throw new Error(result.detail?.message || result.detail || result.msg || '未知错误');
                }
                const fallback = '申请已撤回';
                appendAIMessage('assistant', '客户确认申请：' + (result.data?.message || fallback));
                const operationResult = result.data || {};
                const transactionId = Number(operationResult.data?.transaction_id) || 0;
                if (action === 'confirm' && transactionId && activeWorkorderId &&
                    String(operationResult.code || '').startsWith('TRANSACTION_SUCCEEDED')) {
                    try {
                        await completeActiveWorkorder(transactionId, operationResult.data?.transaction_type || '交易');
                    } catch (workorderError) {
                        showOperatorModal(
                            '交易已成交，工单待核查',
                            workorderError.message || '关联工单完成失败，请人工核查。'
                        );
                    }
                }
                loadWorkorders();
                loadStatistics();
            } catch (error) {
                appendAIMessage('assistant', `二次确认失败：${error.message || '网络异常'}`);
            }
        }

        async function completeActiveWorkorder(transactionId, transactionType) {
            const orderId = activeWorkorderId;
            const response = await fetch(`${API_BASE}/api/wealth/workorder/${orderId}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('access_token')}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    action: 'complete',
                    remark: `${transactionType}已成交，交易流水 #${transactionId}`,
                    related_entity_type: 'transaction',
                    related_entity_id: transactionId
                })
            });
            if (!response.ok) {
                const detail = await response.json().catch(() => ({}));
                throw new Error(detail.detail || '交易已成交，但关联工单完成失败，请人工核查');
            }
            activeWorkorderId = null;
            updateAIContext();
        }

        // 页面由内嵌脚本加载时显式挂载事件入口，保证按钮不会因脚本作用域而失效。
        Object.assign(window, {
            toggleUserDropdown, viewProfile, viewSettings, logout,
            filterWorkorders, claimWorkorder, serviceWorkorder, viewWorkorder,
            createWorkorder, submitWorkorder, queryCustomer, openCustomerPicker, pickCustomerAndContinue, transferAudit, reportSuspicious,
            scrollToSection, closeOperatorModal, selectCustomer,
            toggleAI, sendAIMessage, confirmOperatorAction, resolvePendingOperatorAction, focusWorkorders,
            openCloseWorkorder, syncCloseReasonDetail, submitCloseWorkorder,
        });

        // 点击外部关闭下拉菜单
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('userDropdown');
            const userAvatar = document.querySelector('.user-avatar');

            if (!userAvatar.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
    </script>
